<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="たこ太朗のウェブサイトです">
  <meta name="theme-color" content="#f2f2f2">
  <title>たこ太朗</title>
  <style>
    :root {
      --menu-surface: rgba(218, 218, 218, 0.82);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #f2f2f2;
      color: #222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      content: "";
      background: url("slime-bg.gif") center / cover no-repeat;
      pointer-events: none;
    }

    .menu {
      position: fixed;
      top: max(24px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      z-index: 3;
    }

    .menu__toggle {
      min-width: 88px;
      height: 44px;
      padding: 0 18px;
      color: inherit;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: rgba(226, 226, 226, 0.78);
      border: 0;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .menu__toggle:hover {
      background: rgba(218, 218, 218, 0.88);
    }

    .menu__toggle:active {
      transform: translateY(1px);
    }

    .menu__toggle:focus-visible,
    .menu__link:focus-visible,
    .content-panel__close:focus-visible,
    .content-view__title:focus-visible {
      outline: 2px solid #222;
      outline-offset: 3px;
    }

    .menu__panel {
      width: 184px;
      padding: 8px;
      margin: 8px 0 0;
      list-style: none;
      visibility: hidden;
      background: var(--menu-surface);
      border: 0;
      border-radius: 12px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.12);
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transform: translateY(-12px) scale(0.98);
      transform-origin: top left;
      transition:
        opacity 180ms ease,
        transform 180ms ease,
        visibility 0s linear 180ms;
    }

    .menu.is-open .menu__panel {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition-delay: 0s;
    }

    .menu__link {
      display: block;
      padding: 10px 12px;
      color: inherit;
      font-size: 0.9rem;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 140ms ease;
    }

    .menu__link:hover {
      background: rgba(255, 255, 255, 0.42);
    }

    .content-panel {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 2;
      width: min(520px, 100%);
      height: 100vh;
      height: 100svh;
      padding: clamp(84px, 12vh, 120px) clamp(28px, 6vw, 64px) 48px;
      overflow-y: auto;
      visibility: hidden;
      background: var(--menu-surface);
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transform: translateX(100%);
      transition:
        opacity 220ms ease,
        transform 280ms cubic-bezier(0.2, 0.75, 0.25, 1),
        visibility 0s linear 280ms;
    }

    .content-panel.is-open {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
      transition-delay: 0s;
    }

    .content-panel__close {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      right: max(24px, env(safe-area-inset-right));
      height: 40px;
      padding: 0 14px;
      color: inherit;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.36);
      border: 0;
      border-radius: 10px;
    }

    .content-view__title {
      margin: 0 0 32px;
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      outline: none;
    }

    .about-profile {
      display: grid;
      gap: 28px;
    }

    .about-profile__image {
      display: block;
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 16px;
    }

    .about-profile__text,
    .content-view__placeholder {
      max-width: 34rem;
      margin: 0;
      font-size: 1rem;
      line-height: 1.9;
    }

    @media (prefers-reduced-motion: reduce) {
      .menu__toggle,
      .menu__panel,
      .menu__link,
      .content-panel {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <nav class="menu" aria-label="メニュー">
    <button
      class="menu__toggle"
      type="button"
      aria-expanded="false"
      aria-controls="menu-panel"
    >Menu</button>

    <ul class="menu__panel" id="menu-panel" aria-hidden="true">
      <li><a class="menu__link" href="#about">About</a></li>
      <li><a class="menu__link" href="#software">Software</a></li>
      <li><a class="menu__link" href="#content-1">コンテンツ1</a></li>
      <li><a class="menu__link" href="#content-2">コンテンツ2</a></li>
      <li><a class="menu__link" href="#content-3">コンテンツ3</a></li>
    </ul>
  </nav>

  <aside class="content-panel" aria-hidden="true">
    <button class="content-panel__close" type="button">Close</button>

    <section class="content-view" id="about" hidden>
      <h1 class="content-view__title" tabindex="-1">About</h1>
      <div class="about-profile">
        <img
          class="about-profile__image"
          src="slime-bg.gif"
          alt="プロフィール用のテスト画像"
          width="200"
          height="200"
        >
        <p class="about-profile__text">
          教育者 兼 システムエンジニア。エレキギターとビールが好き。
        </p>
      </div>
    </section>

    <section class="content-view" id="software" hidden>
      <h1 class="content-view__title" tabindex="-1">Software</h1>
      <p class="content-view__placeholder">ソフトウェアの情報をここに追加します。</p>
    </section>

    <section class="content-view" id="content-1" hidden>
      <h1 class="content-view__title" tabindex="-1">コンテンツ1</h1>
      <p class="content-view__placeholder">コンテンツをここに追加します。</p>
    </section>

    <section class="content-view" id="content-2" hidden>
      <h1 class="content-view__title" tabindex="-1">コンテンツ2</h1>
      <p class="content-view__placeholder">コンテンツをここに追加します。</p>
    </section>

    <section class="content-view" id="content-3" hidden>
      <h1 class="content-view__title" tabindex="-1">コンテンツ3</h1>
      <p class="content-view__placeholder">コンテンツをここに追加します。</p>
    </section>
  </aside>

  <script>
    const menu = document.querySelector(".menu");
    const toggle = document.querySelector(".menu__toggle");
    const panel = document.querySelector(".menu__panel");
    const contentPanel = document.querySelector(".content-panel");
    const contentClose = document.querySelector(".content-panel__close");
    const contentLinks = document.querySelectorAll(".menu__link");
    const contentViews = document.querySelectorAll(".content-view");

    function setMenuOpen(isOpen) {
      menu.classList.toggle("is-open", isOpen);
      toggle.setAttribute("aria-expanded", String(isOpen));
      panel.setAttribute("aria-hidden", String(!isOpen));
    }

    function openContent(contentId, shouldFocus = true) {
      const activeView = document.getElementById(contentId);

      if (!activeView || !activeView.classList.contains("content-view")) {
        return;
      }

      contentViews.forEach((view) => {
        view.hidden = view !== activeView;
      });

      contentLinks.forEach((link) => {
        if (link.hash === `#${contentId}`) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });

      contentPanel.classList.add("is-open");
      contentPanel.setAttribute("aria-hidden", "false");

      if (shouldFocus) {
        requestAnimationFrame(() => {
          activeView.querySelector(".content-view__title").focus();
        });
      }
    }

    function closeContent() {
      contentPanel.classList.remove("is-open");
      contentPanel.setAttribute("aria-hidden", "true");
      contentLinks.forEach((link) => link.removeAttribute("aria-current"));
    }

    toggle.addEventListener("click", () => {
      setMenuOpen(!menu.classList.contains("is-open"));
    });

    document.addEventListener("click", (event) => {
      if (!menu.contains(event.target)) {
        setMenuOpen(false);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (menu.classList.contains("is-open")) {
          setMenuOpen(false);
          toggle.focus();
        } else if (contentPanel.classList.contains("is-open")) {
          closeContent();
          toggle.focus();
        }
      }
    });

    contentLinks.forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        setMenuOpen(false);
        openContent(link.hash.slice(1));
      });
    });

    contentClose.addEventListener("click", () => {
      closeContent();
      toggle.focus();
    });

    const initialContent = window.location.hash.slice(1);
    if (initialContent) {
      openContent(initialContent, false);
    }
  </script>
</body>
</html>
