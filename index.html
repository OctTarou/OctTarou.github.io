<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="たこ太朗のウェブサイトです">
  <meta name="theme-color" content="#f2f2f2">
  <title>たこ太朗</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #f2f2f2;
      color: #222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      content: "";
      background: url("slime-bg.gif") center / cover no-repeat;
      pointer-events: none;
    }

    .menu {
      position: fixed;
      top: max(24px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      z-index: 1;
    }

    .menu__toggle {
      min-width: 88px;
      height: 44px;
      padding: 0 18px;
      color: inherit;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: rgba(226, 226, 226, 0.78);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .menu__toggle:hover {
      background: rgba(218, 218, 218, 0.88);
    }

    .menu__toggle:active {
      transform: translateY(1px);
    }

    .menu__toggle:focus-visible,
    .menu__link:focus-visible {
      outline: 2px solid #222;
      outline-offset: 3px;
    }

    .menu__panel {
      width: 184px;
      padding: 8px;
      margin: 8px 0 0;
      list-style: none;
      visibility: hidden;
      background: rgba(218, 218, 218, 0.82);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 12px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.12);
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transform: translateY(-12px) scale(0.98);
      transform-origin: top left;
      transition:
        opacity 180ms ease,
        transform 180ms ease,
        visibility 0s linear 180ms;
    }

    .menu.is-open .menu__panel {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition-delay: 0s;
    }

    .menu__link {
      display: block;
      padding: 10px 12px;
      color: inherit;
      font-size: 0.9rem;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 140ms ease;
    }

    .menu__link:hover {
      background: rgba(255, 255, 255, 0.42);
    }

    @media (prefers-reduced-motion: reduce) {
      .menu__toggle,
      .menu__panel,
      .menu__link {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <nav class="menu" aria-label="メニュー">
    <button
      class="menu__toggle"
      type="button"
      aria-expanded="false"
      aria-controls="menu-panel"
    >Menu</button>

    <ul class="menu__panel" id="menu-panel" aria-hidden="true">
      <li><a class="menu__link" href="#content-1">コンテンツ1</a></li>
      <li><a class="menu__link" href="#content-2">コンテンツ2</a></li>
      <li><a class="menu__link" href="#content-3">コンテンツ3</a></li>
    </ul>
  </nav>

  <script>
    const menu = document.querySelector(".menu");
    const toggle = document.querySelector(".menu__toggle");
    const panel = document.querySelector(".menu__panel");

    function setMenuOpen(isOpen) {
      menu.classList.toggle("is-open", isOpen);
      toggle.setAttribute("aria-expanded", String(isOpen));
      panel.setAttribute("aria-hidden", String(!isOpen));
    }

    toggle.addEventListener("click", () => {
      setMenuOpen(!menu.classList.contains("is-open"));
    });

    document.addEventListener("click", (event) => {
      if (!menu.contains(event.target)) {
        setMenuOpen(false);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && menu.classList.contains("is-open")) {
        setMenuOpen(false);
        toggle.focus();
      }
    });

    panel.addEventListener("click", (event) => {
      if (event.target.closest("a")) {
        setMenuOpen(false);
      }
    });
  </script>
</body>
</html>
