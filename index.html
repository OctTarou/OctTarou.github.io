<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="たこ太朗のウェブサイトです">
  <meta name="theme-color" content="#f2f2f2">
  <title>たこ太朗</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #f2f2f2;
    }

    body::before {
      position: fixed;
      inset: 0;
      content: "";
      background: url("slime-bg.gif") center / cover no-repeat;
    }
  </style>
</head>
<body></body>
</html>
