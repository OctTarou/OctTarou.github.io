<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="たこ太朗のウェブサイトです">
  <meta name="theme-color" content="#f2f2f2">
  <title>たこ太朗</title>
  <style>
    :root {
      --content-surface: rgba(218, 218, 218, 0.82);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #f2f2f2;
      color: #222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    img {
      -webkit-user-drag: none;
    }

    body::before {
      position: fixed;
      inset: 0;
      content: "";
      background: url("slime-bg.gif") center / cover no-repeat;
      pointer-events: none;
    }

    .site-nav {
      position: fixed;
      top: max(24px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      z-index: 3;
      display: flex;
      gap: 28px;
    }

    .site-nav__link {
      padding: 8px 0;
      color: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.7);
      transition: opacity 160ms ease;
    }

    .site-nav__link:hover,
    .site-nav__link[aria-current="page"] {
      opacity: 0.58;
    }

    .site-nav__link:focus-visible,
    .content-view__title:focus-visible {
      outline: 2px solid #222;
      outline-offset: 3px;
    }

    .content-panel {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 2;
      width: 50vw;
      height: 100vh;
      height: 100svh;
      padding: clamp(84px, 12vh, 120px) clamp(28px, 6vw, 64px) 48px;
      overflow-y: auto;
      visibility: hidden;
      background: var(--content-surface);
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transform: translateX(100%);
      transition:
        opacity 220ms ease,
        transform 280ms cubic-bezier(0.2, 0.75, 0.25, 1),
        visibility 0s linear 280ms;
    }

    .content-panel.is-open {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
      transition-delay: 0s;
    }

    .content-view {
      opacity: 1;
      transition: opacity 130ms ease;
    }

    .content-view.is-fading {
      opacity: 0;
    }

    .content-view__title {
      margin: 0 0 32px;
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      outline: none;
    }

    .about-profile {
      display: grid;
      gap: 28px;
    }

    .about-profile__image {
      display: block;
      width: min(200px, 100%);
      height: auto;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 16px;
    }

    .about-profile__text,
    .content-view__placeholder {
      max-width: 34rem;
      margin: 0;
      font-size: 1rem;
      line-height: 1.9;
    }

    @media (prefers-reduced-motion: reduce) {
      .site-nav__link,
      .content-panel,
      .content-view {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="メインナビゲーション">
    <a class="site-nav__link" href="#about">About</a>
    <a class="site-nav__link" href="#software">Software</a>
  </nav>

  <aside class="content-panel" aria-hidden="true">
    <section class="content-view" id="about" hidden>
      <h1 class="content-view__title" tabindex="-1">About</h1>
      <div class="about-profile">
        <img
          class="about-profile__image"
          src="takotarou_icon.png"
          alt="たこ太朗のアイコン"
          width="194"
          height="194"
        >
        <p class="about-profile__text">
          教育者 / システムエンジニア<br>
          <br>
          好き：<br>
          ・ビール<br>
          ・エレキギター<br>
          ・DreamTheater<br>
          <br>
          嫌い：<br>
          ・のぼり坂
        </p>
      </div>
    </section>

    <section class="content-view" id="software" hidden>
      <h1 class="content-view__title" tabindex="-1">Software</h1>
      <p class="content-view__placeholder">ソフトウェアの情報をここに追加します。</p>
    </section>
  </aside>

  <script>
    const contentPanel = document.querySelector(".content-panel");
    const contentLinks = document.querySelectorAll(".site-nav__link");
    const contentViews = document.querySelectorAll(".content-view");
    const fadeDuration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 130;
    let contentSwitchId = 0;

    function wait(duration) {
      return new Promise((resolve) => window.setTimeout(resolve, duration));
    }

    async function openContent(contentId, shouldFocus = true) {
      const activeView = document.getElementById(contentId);

      if (!activeView || !activeView.classList.contains("content-view")) {
        return;
      }

      const switchId = ++contentSwitchId;
      const currentView = Array.from(contentViews).find((view) => !view.hidden);
      const isSwitching =
        contentPanel.classList.contains("is-open") &&
        currentView &&
        currentView !== activeView;

      contentLinks.forEach((link) => {
        if (link.hash === `#${contentId}`) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });

      if (isSwitching && fadeDuration > 0) {
        currentView.classList.add("is-fading");
        await wait(fadeDuration);

        if (switchId !== contentSwitchId) {
          return;
        }

        currentView.hidden = true;
        currentView.classList.remove("is-fading");
        activeView.hidden = false;
        activeView.classList.add("is-fading");
        void activeView.offsetWidth;
        activeView.classList.remove("is-fading");
        await wait(fadeDuration);

        if (switchId !== contentSwitchId) {
          return;
        }

        if (shouldFocus) {
          activeView.querySelector(".content-view__title").focus();
        }

        return;
      }

      contentViews.forEach((view) => {
        view.hidden = view !== activeView;
        view.classList.remove("is-fading");
      });

      contentPanel.classList.add("is-open");
      contentPanel.setAttribute("aria-hidden", "false");

      if (shouldFocus) {
        requestAnimationFrame(() => {
          activeView.querySelector(".content-view__title").focus();
        });
      }
    }

    function closeContent() {
      contentSwitchId += 1;
      contentViews.forEach((view) => view.classList.remove("is-fading"));
      contentPanel.classList.remove("is-open");
      contentPanel.setAttribute("aria-hidden", "true");
      contentLinks.forEach((link) => link.removeAttribute("aria-current"));
    }

    document.addEventListener("click", (event) => {
      const clickedNavLink = event.target.closest(".site-nav__link");
      if (
        contentPanel.classList.contains("is-open") &&
        !contentPanel.contains(event.target) &&
        !clickedNavLink
      ) {
        closeContent();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && contentPanel.classList.contains("is-open")) {
        const activeLink = document.querySelector('.site-nav__link[aria-current="page"]');
        closeContent();
        activeLink?.focus();
      }
    });

    contentLinks.forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        openContent(link.hash.slice(1));
      });
    });

    const initialContent = window.location.hash.slice(1);
    if (initialContent) {
      openContent(initialContent, false);
    }

    document.addEventListener("dragstart", (event) => {
      event.preventDefault();
    });
  </script>
</body>
</html>
